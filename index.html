<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Hub – Student Information Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>

<div class="toast-container position-fixed top-0 end-0 p-3" id="toasts" aria-live="polite"></div>

<!-- AUTH -->
<main id="auth" class="container-fluid">
  <div class="row auth-wrap">
    <section class="col-lg-5 auth-side d-flex flex-column justify-content-center p-5">
      <div class="stripe mb-4"></div>
      <h1 class="display-5 brand">Campus Hub</h1>
      <p class="lead mt-3 mb-0" style="max-width:26rem">Check your grades, see today’s classes, and keep your student profile up to date in one place.</p>
    </section>
    <section class="col-lg-7 d-flex align-items-center justify-content-center p-4">
      <div class="panel p-4 p-md-5 w-100" style="max-width:480px">
        <ul class="nav nav-pills nav-fill mb-4" role="tablist">
          <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#loginPane" type="button">Log in</button></li>
          <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#signupPane" type="button">Sign up</button></li>
        </ul>
        <div class="tab-content">
          <form id="loginPane" class="tab-pane fade show active" novalidate>
            <h2 class="h4 mb-3">Welcome back</h2>
            <div class="mb-3"><label class="form-label" for="lEmail">Email</label><input id="lEmail" type="email" class="form-control" autocomplete="username"></div>
            <div class="mb-3"><label class="form-label" for="lPass">Password</label><input id="lPass" type="password" class="form-control" autocomplete="current-password"></div>
            <div id="lErr" class="text-danger small mb-3 hidden" role="alert"></div>
            <button class="btn btn-primary w-100" type="submit">Log in</button>
          </form>
          <form id="signupPane" class="tab-pane fade" novalidate>
            <h2 class="h4 mb-3">Create your account</h2>
            <div class="mb-3"><label class="form-label" for="sName">Full name</label><input id="sName" class="form-control" autocomplete="name"></div>
            <div class="row g-3 mb-3">
              <div class="col-sm-6"><label class="form-label" for="sId">Student ID</label><input id="sId" class="form-control" placeholder="2026-00123"></div>
              <div class="col-sm-6"><label class="form-label" for="sCourse">Program</label>
                <select id="sCourse" class="form-select"><option>BS Information Technology</option><option>BS Computer Science</option><option>BS Business Administration</option><option>BS Education</option></select></div>
            </div>
            <div class="mb-3"><label class="form-label" for="sEmail">Email</label><input id="sEmail" type="email" class="form-control" autocomplete="username"></div>
            <div class="row g-3 mb-3">
              <div class="col-sm-6"><label class="form-label" for="sPass">Password</label><input id="sPass" type="password" class="form-control" autocomplete="new-password"></div>
              <div class="col-sm-6"><label class="form-label" for="sPass2">Confirm password</label><input id="sPass2" type="password" class="form-control" autocomplete="new-password"></div>
            </div>
            <div id="sErr" class="text-danger small mb-3 hidden" role="alert"></div>
            <button class="btn btn-primary w-100" type="submit">Create account</button>
          </form>
        </div>
        <p class="small text-secondary mt-4 mb-0">Demo only: accounts are saved in this browser, not on a server.</p>
      </div>
    </section>
  </div>
</main>

<!-- DASHBOARD -->
<div id="app" class="container-fluid hidden">
  <div class="row">
    <aside class="col-md-3 col-xl-2 sidebar p-3">
      <div class="d-flex align-items-center gap-3 mb-4">
        <div class="avatar" id="avatar">S</div>
        <div><div class="fw-bold" id="sbName"></div><div class="small text-secondary" id="sbId"></div></div>
      </div>
      <div class="nav nav-pills flex-md-column gap-1" id="menu">
        <button class="nav-link text-start active" data-view="overview">Overview</button>
        <button class="nav-link text-start" data-view="grades">Grades</button>
        <button class="nav-link text-start" data-view="schedule">Schedule</button>
        <button class="nav-link text-start" data-view="profile">Profile</button>
        <button class="nav-link text-start text-danger" id="logout">Log out</button>
      </div>
    </aside>
    <main class="col-md-9 col-xl-10 p-3 p-md-4" id="view"></main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
